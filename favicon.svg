<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c1f"/>
      <stop offset="100%" stop-color="#0a0c0d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    .bg { fill: url(#bgGrad); stroke: rgba(255, 255, 255, 0.14); stroke-width: 1.5; }
    .letter { fill: #f5f6f4; }
    .accent { fill: #2a38f0; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f1214; stroke: rgba(255, 255, 255, 0.22); }
      .letter { fill: #ffffff; }
      .accent { fill: #4d5aff; }
    }
  </style>

  <!-- Background rounded squircle badge -->
  <rect class="bg" x="2" y="2" width="60" height="60" rx="15" ry="15"/>

  <!-- DZ Monogram Paths (fill-rule evenodd for D cutout) -->
  <g fill-rule="evenodd">
    <!-- Letter 'D' -->
    <path class="letter" d="
      M 13 17
      L 22.5 17
      C 28.5 17 32 20.8 32 32
      C 32 43.2 28.5 47 22.5 47
      L 13 47
      Z
      M 18.5 22.8
      L 22.2 22.8
      C 25.5 22.8 26.6 25.4 26.6 32
      C 26.6 38.6 25.5 41.2 22.2 41.2
      L 18.5 41.2
      Z
    "/>

    <!-- Letter 'Z' -->
    <path class="letter" d="
      M 34 17
      L 51 17
      L 51 22.6
      L 40.5 41.4
      L 51 41.4
      L 51 47
      L 34 47
      L 34 41.4
      L 44.5 22.6
      L 34 22.6
      Z
    "/>
  </g>

  <!-- Electric Accent Dot (Echoes portfolio brand accent) -->
  <circle class="accent" cx="49" cy="15" r="3.2"/>
</svg>